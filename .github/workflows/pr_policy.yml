name: pr_policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Policy check
        run: python scripts/check_policy.py
